add_custom_item:
  fields:
    config_entry_id:
      required: true
      selector: {config_entry: {integration: fitatu}}
    meal:
      required: true
      selector:
        select:
          options: [breakfast, second_breakfast, lunch, dinner, snack, supper]
    name:
      required: true
      selector: {text: {}}
    calories:
      required: true
      selector: {number: {min: 0, max: 10000, step: 1, mode: box}}
    protein_g:
      selector: {number: {min: 0, max: 1000, step: 0.1, mode: box}}
    fat_g:
      selector: {number: {min: 0, max: 1000, step: 0.1, mode: box}}
    carbs_g:
      selector: {number: {min: 0, max: 1000, step: 0.1, mode: box}}
    eaten:
      selector: {boolean: {}}
    date:
      selector: {date: {}}
